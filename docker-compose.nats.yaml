services:
  nats:
    image: nats:2.11-alpine
    container_name: open-webui-nats
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    ports:
      - ${NATS_PORT-4222}:4222
      - ${NATS_MONITOR_PORT-8222}:8222
    volumes:
      - nats-data:/data
    restart: unless-stopped

  open-webui:
    environment:
      - 'NATS_URL=nats://nats:4222'

volumes:
  nats-data: {}
