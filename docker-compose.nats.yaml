services:
  nats:
    image: nats:2.11-alpine
    container_name: open-webui-nats
    command:
      - -js
      - -sd
      - /data
      - -m
      - "8222"
    ports:
      - ${NATS_PORT-4222}:4222
      - ${NATS_MONITOR_PORT-8222}:8222
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  open-webui:
    environment:
      - 'NATS_URL=nats://nats:4222'
      - 'ENABLE_EMBEDDED_RETRIEVAL_WORKER=false'
    depends_on:
      nats:
        condition: service_healthy

  retrieval-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/open-webui/open-webui:${WEBUI_DOCKER_TAG-main}
    container_name: open-webui-retrieval-worker
    command: ["python", "-m", "open_webui", "retrieval-worker"]
    environment:
      - 'NATS_URL=nats://nats:4222'
      - 'RETRIEVAL_TRANSPORT=jetstream'
      - 'ENABLE_EMBEDDED_RETRIEVAL_WORKER=true'
      - 'WORKER_ONLY_MODE=true'
      - 'WEBUI_SECRET_KEY='
    volumes:
      - open-webui:/app/backend/data
    depends_on:
      nats:
        condition: service_healthy
    restart: unless-stopped

volumes:
  nats-data: {}
